name: Labs64.IO - Checkout Backend - CI

on:
  push:
    branches: [ "master" ]
    paths:
      - "checkout-be/**"
      - ".github/workflows/checkout-be-ci.yml"
      - ".github/compose/**"
  pull_request:
    paths:
      - "checkout-be/**"
      - ".github/workflows/checkout-be-ci.yml"
      - ".github/compose/**"
  workflow_dispatch:

concurrency:
  group: checkout-be-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    uses: Labs64/labs64.io-workspace/.github/workflows/java-ci.yml@master
    secrets:
      L64_PUB_CI_USERNAME: ${{ secrets.L64_PUB_CI_USERNAME }}
      L64_PUB_CI_PASSWORD: ${{ secrets.L64_PUB_CI_PASSWORD }}
    with:
      working-directory: checkout-be
      maven-goals: verify
      artifact-name: checkout-be-test-reports
      # checkout-be's own application.yml defaults (POSTGRES_HOST=localhost,
      # POSTGRES_PORT=5432, POSTGRES_DB=checkout, guest/guest RabbitMQ, ...)
      # already match these compose services exactly, so no extra env is
      # needed here. (The pre-migration workflow also set
      # SPRING_PROFILES_ACTIVE=test, a profile with no matching config
      # anywhere in the repo — dropped as a no-op.)
      compose-file: .github/compose/checkout-deps.yml
      compose-project: checkout
