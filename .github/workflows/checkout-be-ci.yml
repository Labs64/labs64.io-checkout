name: Labs64.IO - Checkout Backend - CI

on:
  push:
    branches: [ "master" ]
    paths:
      - "checkout-be/**"
      - ".github/workflows/checkout-be-ci.yml"
      - ".github/actions/checkout-deps/**"
      - ".github/compose/**"
  pull_request:
    paths:
      - "checkout-be/**"
      - ".github/workflows/checkout-be-ci.yml"
      - ".github/actions/checkout-deps/**"
      - ".github/compose/**"
  workflow_dispatch:

concurrency:
  group: checkout-be-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: checkout-be

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: checkout
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres

      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest

      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Start deps
        uses: ./.github/actions/checkout-deps
        with:
          action: up

      - name: Maven verify
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-be-test-reports
          path: |
            checkout-be/target/surefire-reports/**
            checkout-be/target/failsafe-reports/**

      - name: Stop deps
        if: always()
        uses: ./.github/actions/checkout-deps
        with:
          action: down

  # the module's domain Cedar policy set must validate
  # against the shared commons schema — drift is a build failure, not a review miss.
  cedar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout commons (shared Cedar schema)
        uses: actions/checkout@v4
        with:
          repository: Labs64/labs64.io-commons
          path: labs64.io-commons
      - name: Cache cedar CLI
        id: cache-cedar
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cedar
          key: cedar-cli-4.11.2
      - name: Install cedar CLI
        run: command -v cedar || cargo install cedar-policy-cli --version 4.11.2 --locked
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build commons (shared preprocessor + schema)
        run: mvn -q -B -f labs64.io-commons/auth-context-java/pom.xml install -DskipTests
      - name: Generate edge + domain Cedar from OpenAPI
        run: mvn -q -B -f checkout-be/pom.xml generate-sources
      - name: Validate generated edge + domain policies against the shared schema
        run: |
          for f in auth-policy.cedar auth-policy-domain.cedar; do
            echo "validating $f"
            cedar validate \
              --schema labs64.io-commons/auth-policy-cedar/schema.cedarschema \
              --schema-format cedar \
              --policies "checkout-be/target/generated-resources/$f"
          done
