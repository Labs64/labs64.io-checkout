name: Labs64.IO - Checkout - Publish Docker

# Publishes the Checkout component images to Docker Hub on GitHub Release:
#   * checkout-be -> labs64/checkout       (image names match the Helm chart repositories)
#   * checkout-fe -> labs64/checkout-ui

permissions:
  contents: read

on:
  release:
    types: [created]

jobs:
  publish-be:
    name: Build & Push Backend image (labs64/checkout)
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/checkout
      context: ./checkout-be
      mode: release
      version: ${{ github.event.release.tag_name }}
      # The checkout-be Dockerfile copies target/*.jar, so build the jar first.
      # Unit/integration tests already gate merges via checkout-be-ci.yml.
      build-command: mvn -B -ntp -DskipTests package --file ./checkout-be/pom.xml
      java-version: "25"
    secrets: inherit

  publish-fe:
    name: Build & Push UI image (labs64/checkout-ui)
    # The checkout-fe Dockerfile is a self-contained multi-stage build (npm build inside),
    # so no build-command/java-version is needed.
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/checkout-ui
      context: ./checkout-fe
      mode: release
      version: ${{ github.event.release.tag_name }}
    secrets: inherit
