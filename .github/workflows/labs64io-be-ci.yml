name: Labs64.IO - Checkout Backend - CI

on:
  push:
    branches: [ "master" ]
    paths:
      - "checkout-be/**"
      - ".github/workflows/labs64io-be-ci.yml"
      - ".github/compose/**"
  pull_request:
    paths:
      - "checkout-be/**"
      - ".github/workflows/labs64io-be-ci.yml"
      - ".github/compose/**"
  workflow_dispatch:

concurrency:
  group: checkout-be-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    uses: Labs64/labs64.io-workspace/.github/workflows/java-ci.yml@master
    secrets:
      L64_PUB_CI_USERNAME: ${{ secrets.L64_PUB_CI_USERNAME }}
      L64_PUB_CI_PASSWORD: ${{ secrets.L64_PUB_CI_PASSWORD }}
    with:
      working-directory: checkout-be
      maven-goals: verify
      artifact-name: checkout-be-test-reports
      # checkout-be's own application.yml defaults (POSTGRES_HOST=localhost,
      # POSTGRES_PORT=5432, POSTGRES_DB=checkout, guest/guest RabbitMQ, ...)
      # already match these compose services exactly, so no extra env is
      # needed here. (The pre-migration workflow also set
      # SPRING_PROFILES_ACTIVE=test, a profile with no matching config
      # anywhere in the repo — dropped as a no-op.)
      compose-file: .github/compose/checkout-deps.yml
      compose-project: checkout
  # Edge image — pushed to Docker Hub as :edge after a green master build. Checkout
  # has never had a published release image, so before this job the only way to
  # deploy it anywhere was to build it from source; labs64.io-tests' nightly
  # regression now deploys this image instead.
  edge-image:
    name: Edge image (labs64/checkout)
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/checkout
      context: ./checkout-be
      # The checkout-be Dockerfile copies target/*.jar, so build the jar first.
      mode: edge
      build-command: mvn -B -ntp -DskipTests package --file ./checkout-be/pom.xml
      java-version: "25"
    secrets: inherit
