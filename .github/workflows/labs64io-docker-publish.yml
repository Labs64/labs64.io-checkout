name: Labs64.IO - Checkout - Publish Docker

# Publishes the Checkout component images to Docker Hub on GitHub Release:
#   * checkout-be -> labs64/checkout       (image names match the Helm chart repositories)
#   * checkout-fe -> labs64/checkout-ui

permissions:
  contents: read

on:
  release:
    types: [created]

jobs:
  publish-be:
    name: Build & Push Backend image (labs64/checkout)
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/checkout
      context: ./checkout-be
      mode: release
      version: ${{ github.event.release.tag_name }}
      # The checkout-be Dockerfile copies target/*.jar, so build the jar first.
      # Unit/integration tests already gate merges via labs64io-be-ci.yml.
      build-command: mvn -B -ntp -DskipTests package --file ./checkout-be/pom.xml
      java-version: "25"
    secrets: inherit

  publish-fe:
    name: Build & Push UI image (labs64/checkout-ui)
    # The checkout-fe Dockerfile is a self-contained multi-stage build (npm build inside),
    # so no build-command/java-version is needed.
    uses: Labs64/labs64.io-workspace/.github/workflows/docker-publish.yml@master
    with:
      image: labs64/checkout-ui
      context: ./checkout-fe
      mode: release
      version: ${{ github.event.release.tag_name }}
    secrets: inherit

  # Opens a PR in labs64.io-helm-charts pinning both digests into charts/checkout.
  # Both images are required: the chart has a single appVersion, so pinning one
  # without the other would deploy a pair that no release validated.
  propagate-to-chart:
    name: Pin digests in charts/checkout
    needs: [publish-be, publish-fe]
    uses: Labs64/labs64.io-workspace/.github/workflows/chart-update-dispatch.yml@master
    with:
      chart: checkout
      version: ${{ github.event.release.tag_name }}
      images: |
        ${{ needs.publish-be.outputs.image-ref }}
        ${{ needs.publish-fe.outputs.image-ref }}
    secrets:
      CHART_DISPATCH_TOKEN: ${{ secrets.CHART_DISPATCH_TOKEN }}
