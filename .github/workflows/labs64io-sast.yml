name: Labs64.IO - Checkout - SAST

# Item 16: SAST as a named release input, distinct from the functional CI in
# checkout-be-ci.yml / checkout-fe-ci.yml. Every run writes a sast-manifest
# artifact naming the scanner + exact version, so a release can state which
# scanners ran against that build.

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checkout-sast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sast:
    permissions:
      contents: read
      security-events: write
    uses: Labs64/labs64.io-workspace/.github/workflows/sast.yml@master
    with:
      manifest-name: checkout-sast-manifest
