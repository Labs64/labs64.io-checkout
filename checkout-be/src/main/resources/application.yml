server:
  port: 8080
  shutdown: graceful

# Trusted gateway auth-context (AuthContextFilter).
# Fail-closed: non-public paths 401 without valid X-Auth-* headers from the
# gateway. The tenant derives from X-Auth-Tenant; tenant.default is a
# dev-only fallback for gateway-less runs (never set it in production).
labs64:
  auth:
    # Domain authorization via the central Cerbos PDP. SHADOW evaluates + audits
    # every decision without blocking; flip to ENFORCE only after the shadow
    # diff is clean (deploy-time override via LABS64_AUTH_AUTHZ_MODE).
    authz:
      enabled: ${LABS64_AUTH_AUTHZ_ENABLED:true}
      mode: ${LABS64_AUTH_AUTHZ_MODE:ENFORCE}
      # Cerbos PDP gRPC address (host:port). In-cluster:
      # cerbos.<ns>.svc.cluster.local:3593.
      pdp-address: ${LABS64_AUTH_AUTHZ_PDPADDRESS:localhost:3593}
  auth-context:
    enabled: true
    public-paths:
      - /actuator
      - /v3/api-docs
      - /swagger-ui
      - /error
  tenant:
    default: "" # empty = no fallback (production); set a value only for gateway-less local dev

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Publish an le=0.5s histogram bucket so the latency SLO rule
      # (slo:latency:ratio_rate5m) has a bucket to divide on.
      slo:
        http.server.requests: 500ms
    export:
      prometheus:
        enabled: true

logging:
  level:
    io.labs64: DEBUG
    org.springframework.cloud.stream: INFO

spring:
  application:
    name: labs64.io-checkout

  cloud:
    stream:
      bindings:
        checkout-out-0:
          destination: labs64-audit-topic
          binder: rabbit
          content-type: application/json
        checkout-in-0:
          destination: labs64-audit-topic
          binder: rabbit
          content-type: application/json
      binders:
        rabbit:
          type: rabbit
      rabbit:
        bindings:
          checkout-out-0:
            producer:
              exchangeType: topic
          checkout-in-0:
            consumer:
              autoBindDlq: true

  messages:
    basename: messages
    fallback-to-system-locale: false
    encoding: UTF-8

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:checkout}?timeZone=UTC
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: false
    locations: classpath:db/migration

checkout:
  currency:
    - USD
    - EUR
